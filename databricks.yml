bundle:
  name: designer-recon-accelerator

# One SHARED folder so the same path opens for everyone; notebooks land directly under it,
# bundle state in a hidden .bundle/ beside them.
workspace:
  root_path: /Workspace/Shared/${bundle.name}/.bundle
  file_path: /Workspace/Shared/${bundle.name}

permissions:
  - level: CAN_MANAGE
    group_name: users

variables:
  catalog_name:
    description: Unity Catalog name for all accelerator tables
    default: lr_dev_aws_us_catalog
  schema_name:
    description: Schema shared by every use case
    default: designer_recon_demo
  landing_volume_name:
    description: UC Volume for UC3 file-landing / fixed-width source files
    default: recon_landing
  warehouse_id:
    description: SQL warehouse for ad-hoc queries
    default: "a3b61648ea4809e3"

targets:
  default:
    default: true
    workspace:
      host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      profile: DEFAULT
  dev:
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      catalog_name: lr_dev_aws_us_catalog
      warehouse_id: "a3b61648ea4809e3"

resources:
  jobs:
    make_autoloader_files:
      name: "[recon-accel] Auto Loader demo — make example files"
      tasks:
        - task_key: make
          notebook_task:
            notebook_path: ./demo_00_autoloader/00_make_files.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              landing_volume_name: ${var.landing_volume_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    generate_cashflow_rec:
      name: "[recon-accel] UC1 generate cash-flow rec sources"
      tasks:
        - task_key: generate
          notebook_task:
            notebook_path: ./demo_01_cashflow_rec/01_generate_sources.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              landing_volume_name: ${var.landing_volume_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    uc1_ingest_autoloader:
      name: "[recon-accel] UC1 ingest bank workbooks (Autoloader) → cf_period_extract"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./demo_01_cashflow_rec/00_ingest_autoloader.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              landing_volume_name: ${var.landing_volume_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    uc1_parse_append_parity:
      name: "[recon-accel] UC1 parse → append → parity → formatted Excel"
      tasks:
        - task_key: parse_parity
          notebook_task:
            notebook_path: ./demo_01_cashflow_rec/02_parse_append_parity.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              landing_volume_name: ${var.landing_volume_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    generate_control_sheet:
      name: "[recon-accel] generate control-sheet sources"
      tasks:
        - task_key: generate
          notebook_task:
            notebook_path: ./demo_02_control_sheet/01_generate_sources.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    automation_file_staging:
      name: "[recon-accel] UC3 file staging (Autoloader)"
      tasks:
        - task_key: file_staging
          notebook_task:
            notebook_path: ./demo_03_automation/01_file_staging.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              landing_volume_name: ${var.landing_volume_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    automation_bdx_parser:
      name: "[recon-accel] UC3 fixed-width parser + contra"
      tasks:
        - task_key: bdx_parser
          notebook_task:
            notebook_path: ./demo_03_automation/02_fixedwidth_parser.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              landing_volume_name: ${var.landing_volume_name}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "3"

  pipelines:
    autoloader_demo:
      name: "[recon-accel] Auto Loader folder→table demo"
      serverless: true
      catalog: ${var.catalog_name}
      schema: ${var.schema_name}
      libraries:
        - file:
            path: ./demo_00_autoloader/pipeline.sql

sync:
  exclude:
    - "*.bak"
